name: Docs

# Builds the Docusaurus documentation site in docs/ on every PR
# and deploys it to docs.datacontract.com on push to main.
# Runs alongside the GitHub Pages site at cli.datacontract.com.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # The Release Notes page is generated from the changelog, so a changelog
      # change has to rebuild the site.
      - 'CHANGELOG.md'
      - '.github/workflows/azure-static-web-apps-docs.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/azure-static-web-apps-docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build # regenerates the release notes, then docusaurus build, which fails on broken links
        working-directory: docs

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      # The Release Notes page is generated from CHANGELOG.md and not committed.
      # Generate it here, so the Oryx build container below finds it even if it
      # cannot read CHANGELOG.md from outside the docs/ app folder.
      - name: Generate the Release Notes page
        run: node docs/scripts/generate-release-notes.mjs
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DATACONTRACT_CLI_DOCS }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "docs"        # Docusaurus project root
          api_location: ""            # no API
          output_location: "build"   # Docusaurus build output (relative to app_location)
          ###### End of Repository/Build Configurations ######
