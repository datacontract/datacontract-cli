name: Docs

# Builds the Docusaurus documentation site in docs/ on every PR
# and deploys it to docs.datacontract.com on push to main.
# Runs alongside the GitHub Pages site at cli.datacontract.com.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # The Release Notes page is generated from the changelog, so a changelog
      # change has to rebuild the site.
      - 'CHANGELOG.md'
      - '.github/workflows/azure-static-web-apps-docs.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/azure-static-web-apps-docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build # regenerates the release notes, then docusaurus build, which fails on broken links
        working-directory: docs
      # The generated page is committed so the Oryx deploy container can fall
      # back to it when it cannot read CHANGELOG.md. Keep the two in sync.
      - name: Check the committed Release Notes match CHANGELOG.md
        run: |
          # --porcelain rather than `git diff` so an uncommitted (untracked) page fails too.
          if [ -n "$(git status --porcelain -- docs/docs/release-notes.md)" ]; then
            echo "::error file=docs/docs/release-notes.md::Out of date. Run 'npm run release-notes' in docs/ and commit the result."
            exit 1
          fi

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DATACONTRACT_CLI_DOCS }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "docs"        # Docusaurus project root
          api_location: ""            # no API
          output_location: "build"   # Docusaurus build output (relative to app_location)
          ###### End of Repository/Build Configurations ######
