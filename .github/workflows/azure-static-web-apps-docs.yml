name: Docs

# Builds the Docusaurus documentation site in docs/ on every PR
# and deploys it to docs.datacontract.com on push to main.
# Runs alongside the GitHub Pages site at cli.datacontract.com.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # The Release Notes page is generated from the changelog, so a changelog
      # change has to rebuild the site.
      - 'CHANGELOG.md'
      - '.github/workflows/azure-static-web-apps-docs.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/azure-static-web-apps-docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # The Commands section is rendered from the CLI's own --help output, so
      # the build needs the CLI importable.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'
          prune-cache: true
      - run: uv sync
      - run: npm ci
        working-directory: docs
      - run: npm run build # regenerates the docs, then docusaurus build, which fails on broken links
        working-directory: docs

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false
      # The Release Notes page and the Commands section are generated and not
      # committed. Generate them here: the Oryx build container below runs the
      # Docusaurus build with Node alone, so it can neither be relied on to read
      # CHANGELOG.md from outside the docs/ app folder nor run the Python
      # generator at all. Both generators keep what they find on disk when they
      # cannot regenerate, so the Oryx build reuses these pages.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'
          prune-cache: true
      - run: uv sync
      - name: Generate the Release Notes page and the Commands section
        run: |
          node docs/scripts/generate-release-notes.mjs
          node docs/scripts/generate-command-docs.mjs
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DATACONTRACT_CLI_DOCS }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "docs"        # Docusaurus project root
          api_location: ""            # no API
          output_location: "build"   # Docusaurus build output (relative to app_location)
          ###### End of Repository/Build Configurations ######
