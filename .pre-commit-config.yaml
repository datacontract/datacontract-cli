# Only what CI also enforces, run from the project's own environment: pinning a
# separate ruff here drifts from the `ruff==` pin in pyproject.toml, and a hook
# that reformats what CI accepts is worse than no hook.
repos:
- repo: local
  hooks:
    - id: ruff
      name: ruff check --fix
      entry: ruff check --fix --force-exclude
      language: system
      types_or: [python, pyi]
      require_serial: true
    - id: ruff-format
      name: ruff format
      entry: ruff format --force-exclude
      language: system
      types_or: [python, pyi]
      require_serial: true
    # docs/docs/commands is generated but committed, and tests/test_docs_commands.py
    # fails on a stale page. Regenerate it here so that never reaches CI.
    - id: command-docs
      name: Regenerate docs/docs/commands from the CLI --help output
      entry: python update_command_docs.py
      language: system
      pass_filenames: false
      files: ^(datacontract/|update_command_docs\.py$)
