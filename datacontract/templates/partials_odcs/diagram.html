<style>
  {% if mermaid_links %}.diagram-container .node { cursor: pointer; }{% endif %}
  .diagram-container .entity-highlight { filter: drop-shadow(0 0 6px #4f46e5) drop-shadow(0 0 2px #4f46e5); }
</style>
<section id="diagram">
  <div class="px-4 sm:px-0">
    <h1 class="text-base font-semibold leading-6 text-gray-900">Entity Relationship Diagram</h1>
    <p class="text-sm text-gray-500">Visual representation of data model relationships</p>
  </div>
  <div class="mt-2 overflow-hidden bg-white shadow-sm ring-1 ring-gray-900/5 sm:rounded-lg">
    <div class="diagram-container p-4 w-full" id="diagram-container">
        <pre class="mermaid">
          {{ mermaid_diagram | safe }}
        </pre>
      </div>
  </div>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';

    mermaid.initialize({
      startOnLoad: false,
      theme: 'neutral'
    });
    await mermaid.run({
      querySelector: '.mermaid',
      postRenderCallback: (id) => {
        const container = document.getElementById("diagram-container");
        const svgElement = container.querySelector("svg");

        if (svgElement) {
          const panzoomInstance = Panzoom(svgElement, {
            maxScale: 5,
            minScale: 0.5,
            step: 0.1,
          });

          container.addEventListener("wheel", (event) => {
            event.preventDefault();
            panzoomInstance.zoomWithWheel(event);
          });
        }
      }
    });

    {% if mermaid_links %}
    // Entity name as drawn by Mermaid (`entity-**name**-<index>`), normalised like the schema anchors.
    const normalize = (name) => name.replace(/\W/g, '_');
    const entities = {};
    document.querySelectorAll('#diagram-container g.node[id*="entity-"]').forEach((node) => {
      const match = node.id.match(/entity-\*\*(.+)\*\*-\d+$/);
      if (match) entities[normalize(match[1])] = node;
    });

    // Entity in the diagram -> its table in the schema section
    document.querySelectorAll('#schema [data-schema]').forEach((table) => {
      const node = entities[normalize(table.dataset.schema)];
      if (!node) return;
      node.addEventListener('click', () => {
        history.replaceState(null, '', '#' + table.id);
        table.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    // Link in a schema table -> its entity in the diagram
    document.querySelectorAll('a.diagram-link').forEach((link) => {
      link.addEventListener('click', (event) => {
        const node = entities[normalize(link.dataset.entity)];
        if (!node) return;
        event.preventDefault();
        document.getElementById('diagram').scrollIntoView({ behavior: 'smooth', block: 'start' });
        node.classList.add('entity-highlight');
        setTimeout(() => node.classList.remove('entity-highlight'), 2500);
      });
    });
    {% endif %}
  </script>
</section>
