  <style>
    /* the text stays readable as is until (or unless) the script below renders it */
    .markdown:not(.rendered) { white-space: pre-wrap; }
    .markdown > :first-child { margin-top: 0; }
    .markdown > :last-child { margin-bottom: 0; }
    .markdown p, .markdown ul, .markdown ol, .markdown pre, .markdown blockquote, .markdown table { margin: 0.5em 0; }
    .markdown ul { list-style: disc; padding-left: 1.25rem; }
    .markdown ol { list-style: decimal; padding-left: 1.25rem; }
    .markdown a { color: #4f46e5; text-decoration: underline; }
    .markdown strong { font-weight: 600; }
    .markdown em { font-style: italic; }
    .markdown code { font-family: ui-monospace, monospace; font-size: 0.85em; background: #f3f4f6; padding: 0.1em 0.3em; border-radius: 0.25rem; }
    .markdown pre { background: #f3f4f6; padding: 0.5rem 0.75rem; border-radius: 0.375rem; overflow-x: auto; }
    .markdown pre code { background: none; padding: 0; }
    .markdown blockquote { border-left: 3px solid #d1d5db; padding-left: 0.75rem; color: #6b7280; }
    .markdown table { border-collapse: collapse; }
    .markdown th, .markdown td { border: 1px solid #d1d5db; padding: 0.15rem 0.5rem; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 { font-weight: 600; margin: 0.5em 0 0.25em; }
  </style>
