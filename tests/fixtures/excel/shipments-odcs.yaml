apiVersion: v3.2.0
kind: DataContract
id: fulfillment_shipments_v1
name: Shipments
version: 1.0.0
domain: sales-team
status: draft
tenant: company-A
dataProduct: shipments
tags:
- datalocation:EU
description:
  purpose: This data can be used for analytical purposes
  usage: Use this to analyze shipments
  limitations: Not suitable for real-time use cases
  authoritativeDefinitions:
  - url: https://example.com/data-guidelines.html
    type: tutorial
    description: Company-wide data guidelines
  customProperties:
  - property: github_link
    value: https://github.example.com/shipment-specification.yaml
customProperties:
- property: owner
  value: controlling-team
- property: additionalField
  value: some value
- property: pii
  value: false
- property: retentionDays
  value: 30
- property: sourceSystem
  value: SAP
  description: The system of record
  vendor: acme
  id: cp-source-system
- property: dbtVersion
  value: '3.10'
- property: regions
  value:
  - eu-west
  - eu-central
- property: costCenter
  value:
    id: 4711
    name: Fulfillment
context:
  instructions: Join on shipment_id only; delivery_date is in UTC.
  verifiedStatements:
  - question: Does this table contain cancelled shipments?
    answer: No, cancelled shipments are excluded before loading.
    tags:
    - completeness
    id: vs-cancelled
    customProperties:
    - property: verifiedBy
      value: data-steward
  constraints:
  - constraint: Do not join to customer PII without a legal basis.
    tags:
    - privacy
    id: c-pii
schema:
- name: shipments
  physicalType: table
  description: Shipment data with orders, delivery dates, carriers and statuses.
  businessName: Shipments
  authoritativeDefinitions:
  - url: https://example.com/definitions/shipments
    type: implementation
  tags:
  - pii
  customProperties:
  - property: sourceTable
    value: sap.vbak
  - property: retention
    value: P1Y
    description: ISO 8601 retention period
  logicalType: object
  physicalName: shipments_v1
  dataGranularityDescription: Not Aggregated
  properties:
  - name: shipment_id
    physicalType: uuid
    physicalName: sid
    description: Unique identifier for each shipment.
    businessName: Shipment ID
    synonyms:
    - synonym: Sendungsnummer
      locale: de-DE
    authoritativeDefinitions:
    - url: definitions/shipment_id.odcs.yaml
      type: businessDefinition
    - url: https://example.com/tutorials/shipment_id
      type: tutorial
      description: How shipment ids are minted
    tags:
    - businesskey
    customProperties:
    - property: masked
      value: true
    - property: external
      value: 'true'
    primaryKey: true
    logicalType: string
    semanticType: dimension
    required: true
    unique: true
    classification: internal
    examples:
    - 123e4567-e89b-12d3-a456-426614174000
    id: prop-shipment-id
  - name: order_id
    physicalType: text
    physicalName: oid
    description: Identifier for the order associated with the shipment.
    businessName: Order ID
    logicalType: string
    logicalTypeOptions:
      minLength: 8
      maxLength: 10
    required: true
    classification: internal
    examples:
    - ORD12345
    relationships:
    - id: rel-order
      type: foreignKey
      to: orders.order_id
  - name: status
    physicalType: text
    description: Current status of the shipment.
    businessName: Status
    deprecated: false
    logicalType: string
    semanticType: dimension
    examples:
    - Delivered
    - In Transit
    enum:
    - value: Delivered
      label: Delivered to the customer
      description: The carrier confirmed the delivery.
      tags:
      - final
      id: enum-delivered
      customProperties:
      - property: color
        value: green
    - value: In Transit
      label: On its way
    - value: 3
      label: Lost
      description: Numeric legacy code
    quality:
    - id: q-status-values
      description: Status must be one of the known values
      type: text
      customProperties:
      - property: owner
        value: quality-team
  - name: weight_kg
    physicalType: decimal
    description: Weight of the parcel.
    businessName: Weight
    logicalType: number
    semanticType: measure
    deprecated: true
    customProperties:
    - property: unit
      value: kg
  - name: address
    physicalType: JSON
    description: Shipping address details.
    businessName: Shipment Address
    logicalType: object
    required: true
    classification: restricted
    properties:
    - name: street
      physicalType: text
      description: Street address.
      logicalType: string
      required: true
    - name: country
      physicalType: text
      description: Country of the shipping address.
      logicalType: string
      required: true
      enum:
      - value: DE
      - value: AT
  - name: items
    physicalType: array
    description: Line items of the shipment.
    logicalType: array
    items:
      logicalType: object
      physicalType: json
      properties:
      - name: sku
        logicalType: string
        physicalType: text
        customProperties:
        - property: catalog
          value: main
  relationships:
  - id: rel-orders
    type: foreignKey
    from: shipments.order_id
    to: orders.order_id
  quality:
  - id: q-rowcount
    description: Table shall contain at least 1 row
    type: sql
    mustBeGreaterOrEqualTo: 1
    query: SELECT COUNT(*) FROM shipments
  context:
    instructions: Filter on status = 'Delivered' for fulfilment KPIs.
    verifiedStatements:
    - question: Is weight_kg always populated?
      answer: No, it is null for letters.
      id: vs-weight
    constraints:
    - constraint: Never aggregate weight_kg across carriers.
      id: c-weight
  synonyms:
  - synonym: Sendungen
    description: German name
    locale: de-DE
    source: business glossary
    status: approved
    customProperties:
    - property: glossaryId
      value: 4711
servers:
- server: production
  type: bigquery
  description: Production dataset
  environment: production
  dataset: shipments_v1
  project: acme_shipments_prod
  customProperties:
  - property: costCenter
    value: cc-42
  id: srv-prod
- server: lakehouse
  type: trino
  environment: dev
  host: trino.example.com
  port: ${TRINO_PORT}
  catalog: iceberg
  schema: shipments
- server: events
  type: kafka
  environment: production
  format: avro
  host: kafka.example.com:9092
support:
- channel: slackname
  url: http://find.me.here
  tool: slack
  scope: interactive
  id: sup-slack
  customProperties:
  - property: sla
    value: 24h
authoritativeDefinitions:
- url: https://example.com/guidelines
  type: tutorial
price:
  priceAmount: 1.0
  priceCurrency: EUR
  priceUnit: Per 1000 requests
team:
  name: Fulfillment Data Team
  description: Owns the shipment data product
  members:
  - username: vimportant
    role: administrator
    dateIn: '2020-01-01'
    id: tm-vi
    customProperties:
    - property: onCall
      value: true
  - username: nimportant
    role: reader
    dateIn: '2020-01-01'
    dateOut: '2024-10-10'
  tags:
  - platform
  id: team-fulfillment
  customProperties:
  - property: costCenter
    value: 42
  - property: slack
    value: '#fulfillment-data'
roles:
- role: analyst
  description: Read access for analysts
  access: read
  firstLevelApprovers: data-owner
  id: role-analyst
  customProperties:
  - property: ticketQueue
    value: DATA
slaDefaultElement: shipments.delivery_date
slaProperties:
- property: availability
  value: 95%
  unit: '%'
  driver: operational
  id: sla-availability
  customProperties:
  - property: measuredBy
    value: statuspage
  authoritativeDefinitions:
  - url: https://example.com/sla
    type: implementation
