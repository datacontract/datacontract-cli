kind: DataContract
apiVersion: v3.1.0
id: test-quality-meta
name: Quality Meta Test
version: 1.0.0
status: active
schema:
  - name: orders
    properties:
      - name: subscription_status
        logicalType: string
        quality:
          - type: custom
            engine: great-expectations
            description: Subscription Status Values
            implementation:
              type: expect_column_values_to_be_in_set
              kwargs:
                column: subscription_status
                value_set:
                  - ACTIVE
                  - CANCELLED
                  - REVOKED
                  - TERMINATED
              meta: {}
            customProperties:
              - property: ruleWeight
                value: 10
              - property: businessOwner
                value: revenue-team
              - property: checkType
                value: business
