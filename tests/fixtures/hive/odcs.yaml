apiVersion: v3.2.0
kind: DataContract
id: hive-orders-test
name: Hive orders
version: 1.0.0
status: active
servers:
  - server: hive
    type: hive
    host: localhost
    port: __PORT__
    database: __DATABASE__
schema:
  - name: orders
    physicalName: orders
    physicalType: table
    properties:
      - name: order_id
        logicalType: string
        physicalType: string
        required: true
        unique: true
        logicalTypeOptions:
          pattern: '^ORD-\d{4}$'
          maxLength: 8
      - name: customer_id
        logicalType: string
        physicalType: varchar(10)
        quality:
          - type: library
            metric: nullValues
            mustBeLessThan: 2
      - name: order_status
        logicalType: string
        physicalType: string
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues: ['open', 'shipped', 'cancelled']
            mustBe: 0
      - name: currency
        logicalType: string
        physicalType: char(3)
        logicalTypeOptions:
          minLength: 3
      - name: order_total
        logicalType: number
        physicalType: decimal(10,2)
        logicalTypeOptions:
          minimum: 0
          maximum: 10000
      - name: quantity
        logicalType: integer
        physicalType: int
        logicalTypeOptions:
          minimum: 1
      - name: line_count
        logicalType: integer
        physicalType: bigint
      - name: discount
        logicalType: number
        physicalType: double
      - name: is_gift
        logicalType: boolean
        physicalType: boolean
      - name: order_date
        logicalType: date
        physicalType: date
      - name: order_timestamp
        logicalType: timestamp
        physicalType: timestamp
      - name: tags
        logicalType: array
        physicalType: array<string>
        items:
          name: tag
          logicalType: string
      - name: shipping
        logicalType: object
        physicalType: struct<city:string,zip:string>
        properties:
          - name: city
            logicalType: string
          - name: zip
            logicalType: string
      - name: attributes
        logicalType: object
        physicalType: map<string,string>
      - name: region
        logicalType: string
        physicalType: string
        required: true
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
      - type: library
        metric: duplicateValues
        arguments:
          properties: ['order_id']
        mustBe: 0
      - type: sql
        description: No order has a negative total
        query: SELECT COUNT(*) FROM ${model} WHERE order_total < 0
        mustBe: 0
      - type: sql
        description: The 95th percentile of order totals stays below 10000
        query: SELECT percentile_approx(CAST(order_total AS DOUBLE), 0.95) FROM ${model}
        mustBeLessThan: 10000
      - type: sql
        description: Every order id follows the ORD-nnnn scheme
        query: SELECT COUNT(*) FROM ${model} WHERE NOT order_id RLIKE '^ORD-[0-9]{4}$'
        mustBe: 0
