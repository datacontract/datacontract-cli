swagger: "2.0"
info:
  title: Orders API
  version: 2.1.0
host: eu.api.example.com
basePath: /v1
schemes: [https]
produces: [application/json]
paths:
  /orders:
    get:
      operationId: listOrders
      summary: All orders of the last 30 days.
      parameters:
        - name: status
          in: query
          type: string
        - name: limit
          in: query
          required: true
          type: integer
          default: 100
      responses:
        "200":
          description: The orders.
          schema:
            type: array
            items:
              $ref: "#/definitions/Order"
    post:
      operationId: createOrder
      responses:
        "201":
          description: Created.
  /orders/search:
    post:
      operationId: searchOrders
      summary: Orders matching a query.
      consumes: [application/json]
      parameters:
        - name: limit
          in: query
          required: true
          type: integer
          default: 100
        - name: query
          in: body
          required: true
          schema:
            type: object
            example:
              status: shipped
      responses:
        "200":
          description: The matching orders.
          schema:
            type: array
            items:
              $ref: "#/definitions/Order"
  /orders/{orderId}:
    parameters:
      - $ref: "#/parameters/OrderId"
    get:
      operationId: getOrder
      description: One order.
      responses:
        "404":
          description: Not found.
        "200":
          $ref: "#/responses/Order"
  /health:
    get:
      produces: [text/plain]
      responses:
        "200":
          description: Healthy.
          schema:
            type: string
parameters:
  OrderId:
    name: orderId
    in: path
    required: true
    type: string
    default: ORD-1001
responses:
  Order:
    description: The order.
    schema:
      $ref: "#/definitions/Order"
definitions:
  Order:
    type: object
    required: [order_id, order_timestamp, status]
    properties:
      order_id:
        type: string
        pattern: "^ORD-[0-9]+$"
        example: ORD-1001
      order_timestamp:
        type: string
        format: date-time
        example: 2024-01-01T10:00:00Z
      status:
        type: string
        enum: [placed, shipped, delivered]
      total:
        type: number
        minimum: 0
        x-nullable: true
      customer:
        $ref: "#/definitions/Customer"
      items:
        type: array
        items:
          allOf:
            - $ref: "#/definitions/Item"
            - required: [sku]
  Customer:
    type: object
    properties:
      customer_id:
        type: string
      email:
        type: string
        format: email
  Item:
    type: object
    properties:
      sku:
        type: string
      quantity:
        type: integer
        minimum: 1
