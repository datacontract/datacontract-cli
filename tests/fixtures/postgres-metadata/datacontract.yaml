apiVersion: v3.1.0
kind: DataContract
id: postgres-metadata
name: Postgres table statistics
version: 1.0.0
status: active
description:
  purpose: Checks the Postgres catalog views instead of the data.

servers:
  - server: catalog
    type: postgres
    host: localhost
    port: 5432
    database: test
    schema: public
    customProperties:
      - property: metadata
        value: true

schema:
  - name: pg_stat_user_tables
    description: One row per table, from the Postgres statistics collector.
    properties:
      - name: relname
        logicalType: string
        physicalType: name
        required: true
        logicalTypeOptions:
          pattern: "^[a-z_]+$"
      - name: n_live_tup
        logicalType: integer
        logicalTypeOptions:
          maximum: 1000000
      - name: last_analyze
        logicalType: timestamp
        required: true

slaProperties:
  - property: freshness
    value: 1
    unit: d
    element: pg_stat_user_tables.last_analyze
