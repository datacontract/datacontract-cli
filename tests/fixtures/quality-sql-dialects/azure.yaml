apiVersion: v3.0.2
kind: DataContract
id: orders-quality-azure
name: Orders quality rules (azure)
version: 1.0.0
status: active
description:
  purpose: >-
    Custom SQL quality rules written in the dialect of a azure server. Used by
    tests/test_quality_sql_dialects.py to keep the read-only SQL guard from
    refusing SQL that a real data source accepts.
servers:
  - server: production
    type: azure
    location: abfss://orders@acme.dfs.core.windows.net/*.parquet
    format: parquet
schema:
  - name: orders
    physicalName: orders
    properties:
      - name: order_id
        logicalType: string
        physicalType: string
      - name: order_total
        logicalType: integer
        physicalType: integer
      - name: order_status
        logicalType: string
        physicalType: string
      - name: order_timestamp
        logicalType: date
        physicalType: timestamp
    quality:
      - type: sql
        description: "One row per order id, using duckdb QUALIFY"
        query: |
          SELECT count(*) FROM ${model} QUALIFY row_number() OVER (PARTITION BY order_id ORDER BY order_timestamp) > 1
        mustBe: 0
      - type: sql
        description: "No negative order totals"
        query: |
          SELECT count(*) FROM ${model} WHERE order_total < 0
        mustBe: 0
