apiVersion: v3.0.2
kind: DataContract
id: orders-quality-bigquery
name: Orders quality rules (bigquery)
version: 1.0.0
status: active
description:
  purpose: >-
    Custom SQL quality rules written in the dialect of a bigquery server. Used by
    tests/test_quality_sql_dialects.py to keep the read-only SQL guard from
    refusing SQL that a real data source accepts.
servers:
  - server: production
    type: bigquery
    project: acme-prod
    dataset: orders
schema:
  - name: orders
    physicalName: orders
    properties:
      - name: order_id
        logicalType: string
        physicalType: string
      - name: order_total
        logicalType: integer
        physicalType: integer
      - name: order_status
        logicalType: string
        physicalType: string
      - name: order_timestamp
        logicalType: date
        physicalType: timestamp
    quality:
      - type: sql
        description: "Fully qualified table name (DIALECT-ONLY: backtick quoting)"
        query: |
          SELECT count(*) FROM `${project}.${dataset}.${model}` WHERE DATE(order_timestamp) = CURRENT_DATE()
        mustBeGreaterOrEqualTo: 0
      - type: sql
        description: "No negative order totals"
        query: |
          SELECT countif(order_total < 0) FROM ${model}
        mustBe: 0
