apiVersion: v3.0.2
kind: DataContract
id: orders-quality-databricks
name: Orders quality rules (databricks)
version: 1.0.0
status: active
description:
  purpose: >-
    Custom SQL quality rules written in the dialect of a databricks server. Used by
    tests/test_quality_sql_dialects.py to keep the read-only SQL guard from
    refusing SQL that a real data source accepts.
servers:
  - server: production
    type: databricks
    host: adb-1234.5.azuredatabricks.net
    catalog: acme
    schema: orders
schema:
  - name: orders
    physicalName: orders
    properties:
      - name: order_id
        logicalType: string
        physicalType: string
      - name: order_total
        logicalType: integer
        physicalType: integer
      - name: order_status
        logicalType: string
        physicalType: string
      - name: order_timestamp
        logicalType: date
        physicalType: timestamp
    quality:
      - type: sql
        description: "The table had rows yesterday too (DIALECT-ONLY: TIMESTAMP AS OF)"
        query: |
          SELECT count(*) FROM ${model} TIMESTAMP AS OF '2026-01-01'
        mustBeGreaterOrEqualTo: 0
      - type: sql
        description: "The first version of the table is still readable (DIALECT-ONLY: VERSION AS OF)"
        query: |
          SELECT count(*) FROM ${model} VERSION AS OF 3
        mustBeGreaterOrEqualTo: 0
