apiVersion: v3.2.0
kind: DataContract
id: orders-quality-iceberg
name: Orders quality rules (iceberg)
version: 1.0.0
status: active
description:
  purpose: >-
    Custom SQL quality rules on an iceberg server, written in duckdb SQL because
    duckdb reads the tables to run them. Used by
    tests/test_quality_sql_dialects.py to keep the read-only SQL guard from
    refusing SQL that a real data source accepts.
servers:
  - server: production
    type: iceberg
    catalog: main
    catalogUrl: https://polaris.acme.internal/api/catalog
    namespace: sales
    warehouse: s3://warehouse
schema:
  - name: orders
    physicalName: orders
    properties:
      - name: order_id
        logicalType: string
        physicalType: string
      - name: order_total
        logicalType: integer
        physicalType: integer
      - name: order_status
        logicalType: string
        physicalType: string
      - name: order_timestamp
        logicalType: date
        physicalType: timestamp
    quality:
      - type: sql
        description: "Rows were read from the table"
        query: |
          SELECT count(*) FROM ${model}
        mustBeGreaterThan: 0
