apiVersion: v3.0.2
kind: DataContract
id: orders-quality-mysql
name: Orders quality rules (mysql)
version: 1.0.0
status: active
description:
  purpose: >-
    Custom SQL quality rules on a mysql server, written in duckdb SQL because
    the tables are copied into duckdb to run them. Used by
    tests/test_quality_sql_dialects.py to keep the read-only SQL guard from
    refusing SQL that a real data source accepts.
servers:
  - server: production
    type: mysql
    host: localhost
    port: 3306
    database: orders
schema:
  - name: orders
    physicalName: orders
    properties:
      - name: order_id
        logicalType: string
        physicalType: string
      - name: order_total
        logicalType: integer
        physicalType: integer
      - name: order_status
        logicalType: string
        physicalType: string
      - name: order_timestamp
        logicalType: date
        physicalType: timestamp
    quality:
      - type: sql
        description: "Orders were copied from MySQL"
        query: |
          SELECT count(*) FROM ${model}
        mustBeGreaterThan: 0
      - type: sql
        description: "Orders arrived in the last day"
        query: |
          SELECT count(*) FROM ${model} WHERE order_timestamp > now() - INTERVAL 1 DAY
        mustBeGreaterThan: 0
