apiVersion: v3.0.2
kind: DataContract
id: orders-quality-postgresql
name: Orders quality rules (postgresql)
version: 1.0.0
status: active
description:
  purpose: >-
    Custom SQL quality rules written in the dialect of a server declaring the `postgresql` spelling of postgres. Used by
    tests/test_quality_sql_dialects.py to keep the read-only SQL guard from
    refusing SQL that a real data source accepts.
servers:
  - server: production
    type: postgresql
    host: localhost
    port: 5432
    database: orders
    schema: public
schema:
  - name: orders
    physicalName: orders
    properties:
      - name: order_id
        logicalType: string
        physicalType: string
      - name: order_total
        logicalType: integer
        physicalType: integer
      - name: order_status
        logicalType: string
        physicalType: string
      - name: order_timestamp
        logicalType: date
        physicalType: timestamp
    quality:
      - type: sql
        description: "Every order has a status the JSON payload agrees with"
        query: |
          SELECT count(*) FROM ${model} WHERE payload->>'status' <> order_status
        mustBe: 0
      - type: sql
        description: "No negative order totals"
        query: |
          SELECT count(*) FILTER (WHERE order_total < 0) FROM ${model}
        mustBe: 0
      - type: sql
        description: "Orders arrived in the last day"
        query: |
          SELECT count(*) FROM ${model} WHERE order_timestamp > now() - interval '1 day'
        mustBeGreaterThan: 0
