apiVersion: v3.0.2
kind: DataContract
id: orders-quality-s3
name: Orders quality rules (s3)
version: 1.0.0
status: active
description:
  purpose: >-
    Custom SQL quality rules written in the dialect of a s3 server. Used by
    tests/test_quality_sql_dialects.py to keep the read-only SQL guard from
    refusing SQL that a real data source accepts.
servers:
  - server: production
    type: s3
    location: s3://acme-orders/orders/*.parquet
    format: parquet
schema:
  - name: orders
    physicalName: orders
    properties:
      - name: order_id
        logicalType: string
        physicalType: string
      - name: order_total
        logicalType: integer
        physicalType: integer
      - name: order_status
        logicalType: string
        physicalType: string
      - name: order_timestamp
        logicalType: date
        physicalType: timestamp
    quality:
      - type: sql
        description: "The parquet files are readable through duckdb"
        query: |
          SELECT count(*) FROM read_parquet('s3://acme-orders/orders/*.parquet')
        mustBeGreaterThan: 0
      - type: sql
        description: "No negative order totals"
        query: |
          SELECT count(*) FROM ${model} WHERE order_total < 0
        mustBe: 0
